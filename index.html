<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Tophcomm Systems — Enterprise Software & Systems Integration</title>
    <meta name="description" content="Tophcomm Systems delivers enterprise software integration, API solutions, cloud infrastructure, and custom development. Home of FS Softwares and DigiCard Innovation." />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; background: #0d0d0d; color: #fff; }
      body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .app-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0d0d; z-index: 9999; transition: opacity 0.6s; }
      .app-loader.hidden { opacity: 0; pointer-events: none; }
      .loader-ring { width: 40px; height: 40px; border: 2px solid rgba(59,130,246,0.15); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" id="app-loader"><div class="loader-ring"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
