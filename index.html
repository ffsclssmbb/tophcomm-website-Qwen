<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <!-- Primary Meta -->
    <title>Tophcomm Systems — Enterprise Software & Systems Integration</title>
    <meta name="title" content="Tophcomm Systems — Enterprise Software & Systems Integration" />
    <meta name="description" content="Tophcomm Systems delivers enterprise software integration, API solutions, cloud infrastructure, and custom development. Home of FS Softwares and DigiCard Innovation. Connect your business systems into one unified platform." />
    <meta name="keywords" content="software integration, systems integration, API development, cloud infrastructure, custom software, enterprise solutions, data pipelines, FS Softwares, DigiCard, Tophcomm" />
    <meta name="author" content="Tophcomm Systems" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="canonical" href="https://tophcomm.systems/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tophcomm.systems/" />
    <meta property="og:title" content="Tophcomm Systems — Enterprise Software & Systems Integration" />
    <meta property="og:description" content="Connect your business systems into one unified platform. API integration, cloud infrastructure, custom software, and managed support for enterprise clients worldwide." />
    <meta property="og:site_name" content="Tophcomm Systems" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://tophcomm.systems/" />
    <meta name="twitter:title" content="Tophcomm Systems — Enterprise Software & Systems Integration" />
    <meta name="twitter:description" content="Connect your business systems into one unified platform. API integration, cloud infrastructure, custom software, and managed support." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Tophcomm Systems",
      "url": "https://tophcomm.systems",
      "logo": "https://tophcomm.systems/favicon.svg",
      "description": "Enterprise software and systems integration company delivering API solutions, cloud infrastructure, custom software, and managed support.",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@tophcomm.systems",
        "contactType": "sales",
        "availableLanguage": ["English"]
      },
      "sameAs": [],
      "subOrganization": [
        {
          "@type": "Organization",
          "name": "FS Softwares Systems",
          "description": "Specialized enterprise software products division"
        },
        {
          "@type": "Organization",
          "name": "DigiCard Innovation",
          "description": "Next-generation digital business card platform"
        }
      ],
      "knowsAbout": ["Software Integration", "API Development", "Cloud Infrastructure", "Data Pipelines", "Custom Software", "Enterprise Solutions"]
    }
    </script>

    <!-- Critical inline styles to prevent FOUC -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html { background-color: #0d0d0d; color: #ffffff; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow-x: hidden; }
      #root { min-height: 100vh; }
      /* Loading screen */
      .app-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0d0d; z-index: 9999; transition: opacity 0.5s ease; }
      .app-loader.hidden { opacity: 0; pointer-events: none; }
      .loader-spinner { width: 40px; height: 40px; border: 3px solid rgba(59,130,246,0.15); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader" id="app-loader">
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
